<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>贪吃蛇</title>
<style>
  :root{
    --paper:#f3eee3; --paper-2:#eae1d0; --ink:#26262a; --ink-soft:#5d5850;
    --teal:#1f6f6b; --teal-2:#2f9b95; --gold:#d9a441; --accent:#d2542a; --line:#d8cfbd;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{background:radial-gradient(circle at 50% 0%,#faf6ec 0%,var(--paper) 55%,var(--paper-2) 100%);
    color:var(--ink);font-family:"STKaiti","KaiTi","Kaiti SC","楷体",serif;
    display:flex;flex-direction:column;align-items:center;padding:8px 8px 20px;}
  h1{font-size:22px;letter-spacing:5px;margin:2px 0 1px;font-weight:700;}
  .subtitle{font-size:11px;color:var(--ink-soft);letter-spacing:1px;margin-bottom:6px;text-align:center;}
  .hud{display:flex;gap:14px;align-items:center;justify-content:center;font-size:13px;color:var(--ink-soft);margin-bottom:5px;}
  .hud b{color:var(--teal);font-size:17px;margin-left:3px;font-family:inherit;}
  .toolbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:6px;}
  .toolbar button{padding:4px 12px;font-size:12px;border-radius:14px;letter-spacing:1px;
    background:linear-gradient(180deg,#fff,#efe7d6);color:var(--ink);border:1px solid var(--line);
    box-shadow:0 2px 0 rgba(0,0,0,.08);}
  .toolbar button.on{background:linear-gradient(180deg,var(--teal-2),var(--teal));color:#fff;border-color:var(--teal);}
  .board{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:760px;margin-bottom:7px;}
  .chip{font-size:11px;padding:2px 8px;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap;}
  .chip.me{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700;}
  .chip.dead{opacity:.45;text-decoration:line-through;}
  .chip .sc{font-weight:700;margin-left:3px;}
  .stage{position:relative;width:min(97vw,760px);}
  canvas#game{width:100%;display:block;background:#f3eee3;border:2px solid var(--line);border-radius:10px;
    box-shadow:0 10px 28px rgba(60,50,30,.16),inset 0 0 0 5px rgba(255,255,255,.3);touch-action:none;}
  canvas#mini{position:absolute;right:7px;bottom:7px;width:88px;height:88px;border-radius:8px;
    border:1px solid var(--line);background:rgba(243,238,227,.8);box-shadow:0 3px 8px rgba(0,0,0,.18);}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:11px;text-align:center;background:rgba(243,238,227,.9);border-radius:10px;padding:18px;}
  .overlay.hidden{display:none;}
  .overlay h2{margin:0;font-size:21px;letter-spacing:3px;}
  .overlay p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.8;max-width:300px;}
  .overlay .big{font-size:26px;color:var(--accent);}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:22px;padding:9px 22px;font-size:15px;
    letter-spacing:2px;color:#fff;background:linear-gradient(180deg,var(--teal-2),var(--teal));
    box-shadow:0 4px 0 #14524f,0 6px 12px rgba(0,0,0,.15);transition:transform .06s;}
  button:active{transform:translateY(3px);}
  .pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:7px;margin-top:12px;}
  .pad button{padding:0;border-radius:12px;font-size:21px;box-shadow:0 3px 0 #14524f;
    background:linear-gradient(180deg,var(--teal-2),var(--teal));}
  .pad .up{grid-column:2;grid-row:1;} .pad .left{grid-column:1;grid-row:2;}
  .pad .down{grid-column:2;grid-row:2;} .pad .right{grid-column:3;grid-row:2;}
  .pad .mid{grid-column:2;grid-row:3;background:linear-gradient(180deg,#b9ab8c,#9c8d6c);box-shadow:0 3px 0 #6f6248;font-size:12px;}
  .pad .boost{grid-column:3;grid-row:3;background:linear-gradient(180deg,#e08a4a,#c8702f);box-shadow:0 3px 0 #8a4a1c;font-size:13px;}
  .pad .mode{grid-column:1;grid-row:3;background:linear-gradient(180deg,#b9ab8c,#9c8d6c);box-shadow:0 3px 0 #6f6248;font-size:11px;}
  .hint{font-size:11px;color:var(--ink-soft);margin-top:10px;letter-spacing:1px;text-align:center;line-height:1.7;max-width:400px;}
  .foot{margin-top:10px;font-size:11px;color:var(--ink-soft);letter-spacing:1px;}
  #fsFloatBtn{position:absolute;left:8px;top:8px;padding:5px 12px;font-size:12px;border-radius:14px;
    background:rgba(255,255,255,.88);color:var(--ink);border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(0,0,0,.18);letter-spacing:1px;}
  #autoBtn{position:absolute;left:8px;top:44px;padding:5px 12px;font-size:12px;border-radius:14px;
    background:rgba(255,255,255,.88);color:var(--ink);border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(0,0,0,.18);letter-spacing:1px;}
  #autoBtn.on{background:linear-gradient(180deg,var(--teal-2),var(--teal));color:#fff;border-color:var(--teal);}
  /* 虚拟摇杆：画布任意位置按下即出现 */
  #stick{position:absolute;width:112px;height:112px;border-radius:50%;pointer-events:none;
    background:rgba(255,255,255,.28);border:2px solid rgba(31,111,107,.45);
    transform:translate(-50%,-50%);display:none;}
  #stick.on{display:block;}
  #stickKnob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;
    border-radius:50%;background:rgba(31,111,107,.8);box-shadow:0 2px 6px rgba(0,0,0,.25);}
  /* 触摸设备：隐藏方向键盘，只留功能按钮 */
  body.touch .pad{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:12px;}
  body.touch .pad .up,body.touch .pad .left,
  body.touch .pad .down,body.touch .pad .right{display:none;}
  body.fs{padding:0;justify-content:flex-start;overflow:hidden;}
  body.fs h1,body.fs .subtitle,body.fs .hud,body.fs .toolbar,
  body.fs .pad,body.fs .hint,body.fs .foot{display:none;}
  body.fs .stage{width:100vw;height:100vh;height:100dvh;}
  body.fs canvas#game{width:100vw;height:100vh;height:100dvh;border:none;border-radius:0;box-shadow:none;}
  /* 全屏仍可见排行榜：右上角浮层 */
  body.fs .board{position:fixed;right:8px;top:8px;flex-direction:column;align-items:flex-end;
    gap:4px;max-width:46vw;z-index:20;pointer-events:none;}
  body.fs .chip{background:rgba(255,255,255,.88);}
  /* 竖屏手机进全屏时强制横屏：screen.orientation.lock 不可用（如 iOS）时用 CSS 旋转兜底 */
  body.fs-rot .stage{position:fixed;top:50%;left:50%;
    width:100vh;height:100vw;width:100dvh;height:100dvw;
    transform:translate(-50%,-50%) rotate(90deg);}
  body.fs-rot #fsFloatBtn,body.fs-rot #autoBtn{position:fixed;}
  @media (max-width:420px){ h1{font-size:19px;} .pad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);} }
  /* 地铁版：家园进度 + 建设家园面板 */
  #homeWrap{display:none;}
  #homeWrap.show{display:inline;}
  .home-panel{position:fixed;left:8px;bottom:8px;max-width:212px;max-height:46vh;overflow:auto;
    background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;
    padding:6px 8px;box-shadow:0 3px 10px rgba(0,0,0,.18);z-index:15;display:none;}
  .home-panel h4{margin:0 0 5px;font-size:12px;letter-spacing:1px;color:var(--ink);}
  .home-panel .hp{display:flex;flex-wrap:wrap;gap:3px;}
  .home-panel .st{font-size:10px;padding:1px 5px;border-radius:8px;background:#eee;color:#9b958a;
    border:1px solid #ddd;white-space:nowrap;}
  .home-panel .st.on{background:var(--teal);color:#fff;border-color:var(--teal);}
  .home-panel .st.next{background:var(--gold);color:#3a2c00;border-color:#caa23a;
    box-shadow:0 0 0 2px rgba(217,164,65,.45);}
  /* 地铁版左下角图示：10 条线路逐条「点亮」的图例 */
  .home-panel .lp{display:flex;flex-direction:column;gap:3px;margin-top:5px;}
  .home-panel .lp-row{display:flex;align-items:center;gap:6px;padding:1px 5px;border-radius:7px;opacity:.42;
    transition:opacity .25s ease, background .25s ease, box-shadow .25s ease;}
  .home-panel .lp-row.lit{opacity:1;background:rgba(217,164,65,.18);box-shadow:0 0 0 2px rgba(217,164,65,.55);}
  .home-panel .lp-row.home{outline:1px dashed rgba(40,40,45,.45);}
  .home-panel .lp-bar{width:14px;height:14px;border-radius:4px;flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.12) inset;}
  .home-panel .lp-name{font-size:11px;color:var(--ink);white-space:nowrap;}
  body.fs .home-panel{max-height:62vh;}
  body.fs #homePanel{left:8px;bottom:8px;}
  /* 切换线路 / 切换城市 选择器 */
  .line-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:540px;margin:10px auto;}
  .line-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:12px;
    background:#fff;border:2px solid #ccc;color:#2a2a30;font-size:14px;cursor:pointer;font-family:inherit;}
  .line-chip.cur{box-shadow:0 0 0 3px rgba(217,164,65,.6);}
  .line-chip .sw{width:14px;height:14px;border-radius:4px;display:inline-block;}
</style>
</head>
<body>
  <h1 id="pageH1">贪吃蛇 · 开放世界</h1>
  <div class="subtitle">长度即分数 · 抢光点 · 撞身掉肉（可切大作战：撞身即死）</div>

  <div class="hud">
    <div>长度 <b id="score">0</b></div>
    <div>最长 <b id="best">0</b></div>
    <div>排名 <b id="rank">-</b></div>
    <div id="homeWrap">家园 <b id="home">0/0</b></div>
  </div>

  <div class="toolbar">
    <button id="modeBtn" class="on">模式：开放世界</button>
    <button id="switchLineBtn">切换线路</button>
    <button id="switchCityBtn">切换城市</button>
    <button id="fsBtn">全屏</button>
  </div>

  <div class="board" id="board"></div>

  <div class="stage">
    <canvas id="game"></canvas>
    <canvas id="mini" width="88" height="88"></canvas>
    <button id="fsFloatBtn">全屏</button>
    <button id="autoBtn">托管</button>
    <div id="stick"><div id="stickKnob"></div></div>
    <div class="overlay" id="startOverlay">
      <h2 id="ovH2">贪吃蛇 · 开放世界</h2>
      <p id="ovIntro">吃发光豆子变长，长度就是分数。</p>
      <button id="startBtn">开始游走</button>
    </div>
    <div class="overlay hidden" id="pauseOverlay">
      <h2>已暂停</h2>
      <p>当前长度 <span class="big" id="pauseScore">0</span></p>
      <button id="resumeBtn">继续</button>
      <button id="restartBtn" style="background:linear-gradient(180deg,#b9ab8c,#9c8d6c);box-shadow:0 4px 0 #6f6248;">重新开始</button>
    </div>
    <div class="overlay hidden" id="deadOverlay">
      <h2>被 <span id="killerName">对手</span> 撞死</h2>
      <p>最终长度 <span class="big" id="finalScore">0</span><br>你的身体已散成豆子，被别人抢走了</p>
      <button id="reviveBtn">重新开始</button>
    </div>
    <div class="overlay hidden" id="linePicker">
      <h2 id="pickerTitle">选择线路</h2>
      <div id="lineGrid" class="line-grid"></div>
      <button id="linePickerClose" style="background:linear-gradient(180deg,#b9ab8c,#9c8d6c);box-shadow:0 4px 0 #6f6248;">关闭</button>
    </div>
  </div>

  <div id="homePanel" class="home-panel"></div>

  <div class="pad">
    <button class="up" data-dir="up">↑</button>
    <button class="left" data-dir="left">←</button>
    <button class="down" data-dir="down">↓</button>
    <button class="right" data-dir="right">→</button>
    <button class="mode" id="padModeBtn">开放世界</button>
    <button class="mid" id="pauseBtn">暂停</button>
    <button class="boost" id="boostBtn">加速</button>
  </div>

  <div class="hint"><b>手机：按住拖动 = 摇杆；连点两下 = 加速冲刺</b>（会掉豆子）<br>
    电脑：方向键 / WASD；<b>连按两次方向键 = 加速冲刺</b>；空格暂停<br>
    点「全屏」→ <b>自动转横屏</b>并铺满 · 点「托管」让 AI 代打（<b>无敌</b>，撞到不掉肉也不死）<br>
    托管时动一下方向键即接管回来</div>
  <div class="foot" id="pageFoot">贪吃蛇</div>

<a href="index.html" style="font-size:11px;color:var(--ink-soft);margin-top:4px;text-decoration:none;">← 返回版本列表</a>

function pickTheme(){
  try{ var id=new URLSearchParams(location.search).get("theme"); if(id&&THEMES[id]) return THEMES[id]; }catch(e){}
  return THEMES.su;
}
const THEME = pickTheme();
var playerLineIdx=0;   // 地铁版：玩家当前所玩线路（切换线路用）

/* —— 地铁版：真实站名池 + 每条蛇的「家园」线路 —— */
function homeLineFor(id,isPlayer){
  if(THEME.kind!=="metro") return null;
  if(isPlayer) return THEME.lines[playerLineIdx];            // 玩家当前所选线路（切换线路可改）
  return THEME.lines[1 + ((id-1) % (THEME.lines.length-1))];
}
var STATION_POOL=[];
if(THEME.kind==="metro"){
  for(var _li=0;_li<THEME.lines.length;_li++){
    var _L=THEME.lines[_li];
    for(var _si=0;_si<_L.stations.length;_si++){
      STATION_POOL.push({name:_L.stations[_si], line:_L.name, color:_L.color});
    }
  }
}
/* 换乘站：出现在 ≥2 条线上的车站（引擎自动从 lines 数据推导，用于「金色枢纽 + 可换线路」提示） */
var TRANSFER={};
if(THEME.kind==="metro"){
  for(var _p=0;_p<STATION_POOL.length;_p++){
    var _n=STATION_POOL[_p].name, _ln=STATION_POOL[_p].line;
    (TRANSFER[_n]=TRANSFER[_n]||[]);
    if(TRANSFER[_n].indexOf(_ln)<0) TRANSFER[_n].push(_ln);
  }
}
function pickStation(){
  if(!STATION_POOL.length) return {name:"站",line:"",color:"#888"};
  return STATION_POOL[(Math.random()*STATION_POOL.length)|0];
}

/* 玩家 / 对手的外观（按主题） */
function playerDef(){
  if(THEME.kind==="metro"){ var L=THEME.lines[playerLineIdx]; return {name:L.name,color:L.color}; }
  return {name:THEME.playerName,color:THEME.playerColor};
}
function botDef(i){
  if(THEME.kind==="metro"){ var L=THEME.lines[1+(i% (THEME.lines.length-1))]; return {name:L.name,color:L.color}; }
  return {name:THEME.botNames[i%THEME.botNames.length], color:THEME.botColors[i%THEME.botColors.length]};
}

    var s=pickStation();
    var tr=TRANSFER[s.name];
    // 换乘站：出现在 ≥2 条线 → 标为金色枢纽，并附「可换线路」列表（帮助记忆线网）
    return {x:x,y:y,station:true,name:s.name,line:s.line,lcolor:s.color,
            transfer:(tr&&tr.length>1)?tr.slice():null, value:value||1};
  }
  return {x:x,y:y,ch:THEME.foodChars[(Math.random()*THEME.foodChars.length)|0],value:value||1};
}

/* ===== 自适应画布 ===== */
var lastCW=0, lastCH=0;
function resize(){
  if(fsMode){                       // 全屏：铺满视口（横屏时视野更宽）
    canvas.style.height = "";
  } else {                          // 常规：保持正方形
    canvas.style.height = (canvas.clientWidth||380)+"px";
  }
  var cssW = canvas.clientWidth || 380;
  var cssH = canvas.clientHeight || cssW;   // 读实际布局尺寸（会触发回流）
  if(cssW<2 || cssH<2) return;
  lastCW=cssW; lastCH=cssH;
  CELL = 30;                        // 固定每格像素，保证豆子里的字看得清
  VCOLS = cssW/CELL; VROWS = cssH/CELL;
  VW = cssW; VH = cssH;
  // 位图尺寸必须严格等于 CSS 盒子尺寸，否则被非等比拉伸 → 横屏时字和圆豆会歪
  canvas.width = Math.round(cssW*dpr);
  canvas.height = Math.round(cssH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize", function(){ resize(); if(!running) draw(0); });
window.addEventListener("orientationchange", function(){
  setTimeout(function(){ updateOrientation(); if(!running) draw(0); },300);
});
// 横竖屏切换 / 移动端工具栏收放：尺寸真变了才重算
if(window.ResizeObserver){
  try{
    new ResizeObserver(function(){
      var cw=canvas.clientWidth||0, ch=canvas.clientHeight||0;
      if(Math.abs(cw-lastCW)>1 || Math.abs(ch-lastCH)>1){ resize(); if(!running) draw(0); }
    }).observe(canvas);
  }catch(e){}
}
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", function(){
    setTimeout(function(){ resize(); if(!running) draw(0); },120);
  });
}

/* ===== 初始化 ===== */
function occSet(){
  var s={};
  for(var i=0;i<snakes.length;i++){ var sn=snakes[i];
    if(!sn.alive) continue;
    for(var j=0;j<sn.body.length;j++) s[sn.body[j].x+","+sn.body[j].y]=1; }
  return s;
}
function spawnFood(n){
  var occ=occSet();
  for(var i=0;i<n;i++){
    var c,g=0;
    do{ c={x:rnd(WCOLS),y:rnd(WROWS)}; g++; }while(occ[c.x+","+c.y]&&g<60);
    occ[c.x+","+c.y]=1;
    food.push(mkFood(c.x,c.y,1));
  }
}
function spawnSnake(o){
  var len=o.len||START_LEN;
  var h={x:rnd(WCOLS),y:rnd(WROWS)};
  var d=o.dir||{x:1,y:0}, body=[];
  for(var i=0;i<len;i++) body.push({x:(h.x-d.x*i+WCOLS)%WCOLS, y:(h.y-d.y*i+WROWS)%WROWS});
  return {id:o.id,name:o.name,color:o.color,isPlayer:!!o.isPlayer,alive:true,
    body:body, prev:body.map(function(c){return {x:c.x,y:c.y};}), dir:d, nextDir:d,
    score:len, boosting:false, respawnAt:0, hitCd:0, bc:0,
    homeLine:null, nextHomeIdx:0, homeGlow:0};
}
function reset(){
  food=[]; snakes=[]; tickCount=0;
  var pd=playerDef();
  player=spawnSnake({id:0,name:pd.name,color:pd.color,isPlayer:true});
  player.homeLine=homeLineFor(0,true);
  snakes.push(player);
  for(var i=0;i<BOT_COUNT;i++){ var d=botDef(i);
    var bs=spawnSnake({id:i+1,name:d.name,color:d.color,len:BOT_START_LEN});
    bs.homeLine=homeLineFor(i+1,false);
    snakes.push(bs); }
  camX=player.body[0].x; camY=player.body[0].y; camInit=true;
  scoreEl.textContent=player.score; updateBoard(); spawnFood(FOOD_TARGET);
}

/* ===== AI ===== */
function botThink(sn){
  // 迟钝：每 BOT_DECIDE 拍才重新想一次，其余时间直行（会错过转弯、绕远路）
  if(tickCount % BOT_DECIDE !== 0) return;
  var h=sn.body[0], i;
  var bestF=null, bestS=-1;
  for(i=0;i<food.length;i++){
    var f=food[i];
    var dx=rel(f.x,h.x,WCOLS), dy=rel(f.y,h.y,WROWS);
    var d=Math.sqrt(dx*dx+dy*dy)+1;
    if(d>BOT_SIGHT) continue;          // 近视：看不见远处的豆子
    var sc=(f.value*4)/d;
    if(sc>bestS){bestS=sc;bestF=f;}
  }
  var all=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
  var opts=all.filter(function(o){return !(o.x===-sn.dir.x&&o.y===-sn.dir.y);});
  // 失误：小概率乱转，不再精准追豆
  if(Math.random()<BOT_MISS){ sn.nextDir=opts[rnd(opts.length)]; return; }
  var occ=occSet();
  var pick=null, pd=-1e9;
  for(i=0;i<opts.length;i++){
    var o=opts[i];
    var nx=(h.x+o.x+WCOLS)%WCOLS, ny=(h.y+o.y+WROWS)%WROWS;
    var s2 = occ[nx+","+ny] ? -1000 : 0;
    if(bestF){ var ex=rel(bestF.x,nx,WCOLS), ey=rel(bestF.y,ny,WROWS); s2 -= Math.sqrt(ex*ex+ey*ey); }
    else s2 += Math.random();
    if(s2>pd){pd=s2;pick=o;}
  }
  sn.nextDir=pick||opts[0];
}

/* 托管：给玩家蛇用的 AI —— 每拍决策、全图视野、不失误，比对手聪明 */
function autoThink(sn){
  var h=sn.body[0], i;
  var bestF=null, bestS=-1;
  for(i=0;i<food.length;i++){
    var f=food[i];
    var dx=rel(f.x,h.x,WCOLS), dy=rel(f.y,h.y,WROWS);
    var d=Math.sqrt(dx*dx+dy*dy)+1;
    var sc=(f.value*4)/d;                 // 大豆子优先
    if(sc>bestS){bestS=sc;bestF=f;}
  }
  var opts=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}]
    .filter(function(o){return !(o.x===-sn.dir.x&&o.y===-sn.dir.y);});
  var occ=occSet();
  var pick=null, pd=-1e9;
  for(i=0;i<opts.length;i++){
    var o=opts[i];
    var nx=(h.x+o.x+WCOLS)%WCOLS, ny=(h.y+o.y+WROWS)%WROWS;
    var s2 = occ[nx+","+ny] ? -1000 : 0;  // 不往别人（或自己）身上撞
    if(bestF){ var ex=rel(bestF.x,nx,WCOLS), ey=rel(bestF.y,ny,WROWS); s2 -= Math.sqrt(ex*ex+ey*ey); }
    else s2 += Math.random();
    if(s2>pd){pd=s2;pick=o;}
  }
  sn.nextDir=pick||opts[0];
}

/* 地铁版：按真实相邻顺序吃下本线下一站 → 建成家园一节（额外奖励），并高亮 */
function tryBuildHome(sn,f){
  if(!sn.homeLine) return;
  var st=sn.homeLine.stations, idx=sn.nextHomeIdx||0;
  if(idx<st.length && f.name===st[idx]){
    sn.nextHomeIdx=idx+1; sn.homeGlow=12;
    var t=sn.body[sn.body.length-1];
    sn.body.push({x:t.x,y:t.y,name:f.name,line:f.line});   // 奖励一节，永久加长
  }
}

/* ===== 大作战机制 ===== */
function dropMeat(sn,n){
  for(var i=0;i<n && sn.body.length>START_LEN;i++){
    var t=sn.body.pop();
    food.push(mkFood(t.x,t.y,3));
  }
  sn.score=sn.body.length;
  if(sn.isPlayer){ scoreEl.textContent=sn.score; hitFlash=1; }
}
function killSnake(sn,killer){
  for(var i=0;i<sn.body.length;i++) food.push(mkFood(sn.body[i].x,sn.body[i].y,3));
  var finalLen=sn.body.length;
  sn.alive=false; sn.body=[]; sn.prev=[]; sn.score=0;
  sn.respawnAt = sn.isPlayer ? 0 : performance.now()+2500;
  if(sn.isPlayer){
    killerNameEl.textContent = killer?killer.name:"对手";
    finalScoreEl.textContent = finalLen;
    deadOverlay.classList.remove("hidden");
    running=false;
  }
}
function moveSnake(sn,now){
  if(!sn.alive) return;
  if(sn.isPlayer){
    if(autoMode) autoThink(sn);
  } else {
    if(tickCount % BOT_SKIP !== 0) return;   // 1=与玩家同速
    botThink(sn);
  }
  sn.dir=sn.nextDir;
  var h=sn.body[0];
  var nh={x:(h.x+sn.dir.x+WCOLS)%WCOLS, y:(h.y+sn.dir.y+WROWS)%WROWS};
  var hit=null, i, j;
  for(i=0;i<snakes.length;i++){
    var o=snakes[i];
    if(o===sn||!o.alive) continue;
    for(j=0;j<o.body.length;j++){ if(o.body[j].x===nh.x&&o.body[j].y===nh.y){hit=o;break;} }
    if(hit) break;
  }
  if(hit){
    if(sn.isPlayer && autoMode) return;      // 托管无敌：只被挡住，不掉肉、不死
    if(mode==="battle"){ killSnake(sn,hit); return; }
    if(now-sn.hitCd>HIT_CD){ dropMeat(sn,DROP_MEAT); sn.hitCd=now; }
    return;
  }
  sn.body.unshift(nh);
  var ate=-1;
  for(i=0;i<food.length;i++){ if(food[i].x===nh.x&&food[i].y===nh.y){ate=i;break;} }
  if(ate>=0){
    var f=food[ate]; food.splice(ate,1);
    sn.body[0].name=f.name; sn.body[0].line=f.line;     // 蛇身由吃掉的站名组成
    if(THEME.kind==="metro" && sn.isPlayer) tryBuildHome(sn,f);
    for(var k=1;k<f.value;k++){ var t=sn.body[sn.body.length-1]; sn.body.push({x:t.x,y:t.y}); }
  } else {
    sn.body.pop();
    // 地铁版：站点名朝蛇头流动，使蛇身成为一条「站名链」（头=最近吃到的站）
    for(var j=0;j<sn.body.length-1;j++){ sn.body[j].name=sn.body[j+1].name; sn.body[j].line=sn.body[j+1].line; }
  }
  sn.score=sn.body.length;
  if(sn.isPlayer){
    scoreEl.textContent=sn.score;
    if(sn.score>best){best=sn.score;bestEl.textContent=best;localStorage.setItem(THEME.bestKey,String(best));}
  }
  if(sn.boosting && sn.body.length>START_LEN){    // 冲刺有代价：掉的肉落地成豆子
    sn.bc=(sn.bc||0)+1;
    if(sn.bc%BOOST_DROP===0){
      var tail=sn.body.pop();
      food.push(mkFood(tail.x,tail.y,2));
      sn.score=sn.body.length;
      if(sn.isPlayer) scoreEl.textContent=sn.score;
    }
  }
}
function tick(now){
  var i;
  tickCount++;
  for(i=0;i<snakes.length;i++){
    var sn=snakes[i];
    if(!sn.alive){
      if(sn.respawnAt && now>=sn.respawnAt && !sn.isPlayer){
        var bd=botDef(sn.id-1);
        snakes[i]=spawnSnake({id:sn.id,name:bd.name,color:bd.color,len:BOT_START_LEN});
        snakes[i].homeLine=homeLineFor(sn.id,false);
      }
      continue;
    }
    sn.prev=sn.body.map(function(c){return {x:c.x,y:c.y};});
  }
  for(i=0;i<snakes.length;i++) moveSnake(snakes[i],now);
  if(player && player.alive && player.boosting) moveSnake(player,now);
  if(food.length<FOOD_TARGET) spawnFood(FOOD_TARGET-food.length);
  updateBoard();
}

/* ===== 相机：死区 + 平滑跟随 ===== */
function headInterp(sn){
  var b=sn.body, p=sn.prev;
  if(!b.length) return {x:camX,y:camY};
  var p0 = p.length?p[0]:b[0];
  return {x:p0.x+rel(b[0].x,p0.x,WCOLS)*alpha, y:p0.y+rel(b[0].y,p0.y,WROWS)*alpha};
}
function updateCam(){
  if(!player) return;
  var h=headInterp(player);
  if(!camInit){camX=h.x;camY=h.y;camInit=true;return;}
  var tx=camX, dx=rel(h.x,camX,WCOLS);
  if(dx>DEAD_ZONE) tx=camX+(dx-DEAD_ZONE);
  else if(dx<-DEAD_ZONE) tx=camX+(dx+DEAD_ZONE);
  var ty=camY, dy=rel(h.y,camY,WROWS);
  if(dy>DEAD_ZONE) ty=camY+(dy-DEAD_ZONE);
  else if(dy<-DEAD_ZONE) ty=camY+(dy+DEAD_ZONE);
  camX += (tx-camX)*CAM_LERP;
  camY += (ty-camY)*CAM_LERP;
}

/* ===== 渲染 ===== */
function sx(wx){ return ((VCOLS-1)/2 + rel(wx,camX,WCOLS))*CELL; }
function sy(wy){ return ((VROWS-1)/2 + rel(wy,camY,WROWS))*CELL; }

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* 地铁版图：细轨（线路色）+ 白色中线，像真实轨道 */
function drawMetroTrack(pts, sn){
  ctx.save();
  ctx.strokeStyle=sn.color; ctx.lineWidth=CELL*0.20; ctx.lineCap="round"; ctx.lineJoin="round";
  var started=false, k;
  for(k=1;k<pts.length;k++){
    var d=Math.hypot(pts[k].x-pts[k-1].x, pts[k].y-pts[k-1].y);
    if(d>CELL*1.8){ started=false; continue; }
    if(!started){ ctx.beginPath(); ctx.moveTo(pts[k-1].x,pts[k-1].y); started=true; }
    ctx.lineTo(pts[k].x,pts[k].y);
  }
  ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=Math.max(1,CELL*0.06);
  started=false;
  for(k=1;k<pts.length;k++){
    var d2=Math.hypot(pts[k].x-pts[k-1].x, pts[k].y-pts[k-1].y);
    if(d2>CELL*1.8){ started=false; continue; }
    if(!started){ ctx.beginPath(); ctx.moveTo(pts[k-1].x,pts[k-1].y); started=true; }
    ctx.lineTo(pts[k].x,pts[k].y);
  }
  ctx.stroke();
  ctx.restore();
}
/* 地铁版站点节点：线路色圆点 + 白环 + 全名（上下交错防挤） */
function drawStationNode(x,y,name,color,k){
  var r=CELL*0.30;
  ctx.beginPath(); ctx.arc(x,y,r,0,6.2832);
  ctx.fillStyle=color; ctx.fill();
  ctx.lineWidth=Math.max(1.6,CELL*0.08); ctx.strokeStyle="rgba(255,255,255,.95)"; ctx.stroke();
  if(!name) return;
  var fs=Math.max(CELL*0.20, Math.min(CELL*0.34, Math.floor(CELL*0.92/name.length)));
  ctx.font="bold "+fs+"px 'STKaiti','KaiTi','楷体',sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  var oy=(k%2===0)? -r-CELL*0.40 : r+CELL*0.44;
  ctx.lineWidth=2.4; ctx.strokeStyle="rgba(255,255,255,.95)"; ctx.strokeText(name,x,y+oy);
  ctx.fillStyle="rgba(28,28,34,.98)"; ctx.fillText(name,x,y+oy);
}

function strokeSeg(arr,color,isPlayer){
  var k;
  if(arr.length<2){
    ctx.strokeStyle="rgba(40,40,45,.9)"; ctx.lineWidth=CELL*0.80+3;
    ctx.beginPath(); ctx.arc(arr[0].x,arr[0].y,CELL*0.40,0,6.2832); ctx.stroke();
    ctx.fillStyle=color;
    ctx.beginPath(); ctx.arc(arr[0].x,arr[0].y,CELL*0.36,0,6.2832); ctx.fill();
    if(THEME.kind==="metro"){
      ctx.fillStyle="rgba(255,255,255,.9)";
      ctx.beginPath(); ctx.arc(arr[0].x,arr[0].y,CELL*0.14,0,6.2832); ctx.fill();
    }
    return;
  }
  ctx.lineCap="round"; ctx.lineJoin="round";
  if(isPlayer){
    ctx.strokeStyle="rgba(217,164,65,.95)"; ctx.lineWidth=CELL*0.86+4;
    ctx.beginPath(); ctx.moveTo(arr[0].x,arr[0].y);
    for(k=1;k<arr.length;k++) ctx.lineTo(arr[k].x,arr[k].y); ctx.stroke();
  }
  ctx.strokeStyle="rgba(38,38,42,.92)"; ctx.lineWidth=CELL*0.80+3;
  ctx.beginPath(); ctx.moveTo(arr[0].x,arr[0].y);
  for(k=1;k<arr.length;k++) ctx.lineTo(arr[k].x,arr[k].y); ctx.stroke();
  ctx.strokeStyle=color; ctx.lineWidth=CELL*0.80;
  ctx.beginPath(); ctx.moveTo(arr[0].x,arr[0].y);
  for(k=1;k<arr.length;k++) ctx.lineTo(arr[k].x,arr[k].y); ctx.stroke();
  if(THEME.kind==="metro"){   // 地铁线：中间白色虚线，像轨道
    ctx.save();
    ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.lineWidth=Math.max(2,CELL*0.16);
    ctx.setLineDash([CELL*0.20, CELL*0.20]);
    ctx.beginPath(); ctx.moveTo(arr[0].x,arr[0].y);
    for(k=1;k<arr.length;k++) ctx.lineTo(arr[k].x,arr[k].y); ctx.stroke();
    ctx.restore();
  }
}

function draw(a){
  alpha=a;
  var S=VW, SH=VH, i, k;
  ctx.fillStyle="#f3eee3"; ctx.fillRect(0,0,S,SH);
  ctx.strokeStyle="rgba(150,138,112,.13)"; ctx.lineWidth=1;
  var gx0=Math.floor(camX-(VCOLS-1)/2), gy0=Math.floor(camY-(VROWS-1)/2);
  var nc=Math.ceil(VCOLS)+2, nr=Math.ceil(VROWS)+2;
  for(i=-1;i<=nc;i++){ var X=sx(gx0+i); ctx.beginPath();ctx.moveTo(X,0);ctx.lineTo(X,SH);ctx.stroke(); }
  for(i=-1;i<=nr;i++){ var Y=sy(gy0+i); ctx.beginPath();ctx.moveTo(0,Y);ctx.lineTo(S,Y);ctx.stroke(); }
  // 食物
  var pulse=0.5+0.5*Math.sin(Date.now()/260);
  for(i=0;i<food.length;i++){
    var f=food[i], FX=sx(f.x), FY=sy(f.y);
    if(FX<-CELL||FY<-CELL||FX>S+CELL||FY>SH+CELL) continue;
    if(THEME.kind==="metro"){
      // 真实车站：白底圆角 + 线路色环 + 站名（每个字/站是一个食物）
      var isHub=!!f.transfer;
      var ss=CELL*0.34;
      if(isHub){   // 换乘枢纽：金色底座
        ctx.fillStyle="#f7d774";
        ctx.strokeStyle="#caa23a"; ctx.lineWidth=Math.max(2,CELL*0.10);
        roundRect(FX-ss/2-CELL*0.08,FY-ss/2-CELL*0.08,ss+CELL*0.16,ss+CELL*0.16,CELL*0.14); ctx.fill(); ctx.stroke();
      }else{
        ctx.fillStyle="#fff";
        ctx.strokeStyle=f.lcolor||"rgba(40,40,45,.85)"; ctx.lineWidth=Math.max(2,CELL*0.10);
        roundRect(FX-ss/2,FY-ss/2,ss,ss,CELL*0.12); ctx.fill(); ctx.stroke();
      }
      if(f.name){
        // 真实车站：白底圆角「票根」按站名尺寸自适应，站名放大加粗、白描边防糊
        var nm=f.name;
        var fs2=Math.max(CELL*0.22, Math.min(CELL*0.52, Math.floor(CELL*0.92/nm.length)));
        ctx.font="bold "+fs2+"px 'STKaiti','KaiTi','楷体',sans-serif";
        ctx.textAlign="center"; ctx.textBaseline="middle";
        var tw=ctx.measureText(nm).width, padX=CELL*0.16, padY=CELL*0.07;
        var bw=Math.max(tw+padX*2, CELL*0.62), bh=fs2+padY*2;
        if(isHub){
          // 换乘枢纽：金色「票根」+ 双环 + ⇄ 角标，强化「哪站能换哪几条线」的记忆
          ctx.fillStyle="#f7d774";
          ctx.strokeStyle="#caa23a"; ctx.lineWidth=Math.max(2.2,CELL*0.12);
          roundRect(FX-bw/2-CELL*0.10, FY-bh/2-CELL*0.10, bw+CELL*0.20, bh+CELL*0.20, CELL*0.22); ctx.fill(); ctx.stroke();
          ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=Math.max(1.4,CELL*0.06);
          roundRect(FX-bw/2-CELL*0.06, FY-bh/2-CELL*0.06, bw+CELL*0.12, bh+CELL*0.12, CELL*0.18); ctx.stroke();
          ctx.fillStyle="#caa23a"; ctx.beginPath();
          ctx.arc(FX+bw/2+CELL*0.10, FY-bh/2-CELL*0.10, CELL*0.20, 0, 6.2832); ctx.fill();
          ctx.fillStyle="#fff"; ctx.font="bold "+(CELL*0.26)+"px 'STKaiti','KaiTi','楷体',sans-serif";
          ctx.fillText("⇄", FX+bw/2+CELL*0.10, FY-bh/2-CELL*0.10+0.5);
          ctx.lineWidth=2.6; ctx.strokeStyle="rgba(255,255,255,.95)"; ctx.strokeText(nm,FX,FY+0.5);
          ctx.fillStyle="rgba(60,44,12,.98)"; ctx.fillText(nm,FX,FY+0.5);
        }else{
          ctx.fillStyle="#fff";
          ctx.strokeStyle=f.lcolor||"rgba(40,40,45,.9)"; ctx.lineWidth=Math.max(1.8,CELL*0.09);
          roundRect(FX-bw/2, FY-bh/2, bw, bh, CELL*0.20); ctx.fill(); ctx.stroke();
          ctx.lineWidth=2.6; ctx.strokeStyle="rgba(255,255,255,.95)"; ctx.strokeText(nm,FX,FY+0.5);
          ctx.fillStyle="rgba(26,26,32,.97)"; ctx.fillText(nm,FX,FY+0.5);
        }
      }
      continue;
    }
    var r=(f.value>1?CELL*0.44:CELL*0.32);   // 豆子整体放大，字才看得清
    if(f.value>2) r*= (1+0.12*pulse);
    var g=ctx.createRadialGradient(FX-r*0.3,FY-r*0.35,r*0.15,FX,FY,r*1.6);
    g.addColorStop(0,"#ffd9a8"); g.addColorStop(0.45,"#e8783a"); g.addColorStop(1,"rgba(210,84,42,0)");
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(FX,FY,r*1.6,0,6.2832); ctx.fill();
    ctx.fillStyle="#c8451c";
    ctx.beginPath(); ctx.arc(FX,FY,r,0,6.2832); ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.75)"; ctx.lineWidth=Math.max(1,CELL*0.045);
    ctx.beginPath(); ctx.arc(FX,FY,r,0,6.2832); ctx.stroke();
    ctx.fillStyle="#fffaf0"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font="bold "+Math.max(13,r*1.30)+"px 'STKaiti','KaiTi','楷体',serif";
    ctx.fillText(f.ch,FX,FY+0.5);
  }
  // 蛇
  for(i=0;i<snakes.length;i++){
    var sn=snakes[i];
    if(!sn.alive||!sn.body.length) continue;
    var pts=[];
    for(k=0;k<sn.body.length;k++){
      var c=sn.body[k], p=(k<sn.prev.length?sn.prev[k]:c);
      var ix=p.x+rel(c.x,p.x,WCOLS)*alpha, iy=p.y+rel(c.y,p.y,WROWS)*alpha;
      pts.push({x:sx(ix),y:sy(iy)});
    }
    if(THEME.kind==="metro"){
      // 地铁版图：细轨 + 站点圆点 + 全名（o积水潭o安定门o鼓楼大街 风格）
      drawMetroTrack(pts, sn);
      for(k=1;k<pts.length;k++){
        var TX=pts[k].x, TY=pts[k].y;
        if(TX<-CELL||TY<-CELL||TX>S+CELL||TY>SH+CELL) continue;
        drawStationNode(TX,TY, (sn.body[k]&&sn.body[k].name)||null, sn.color, k);
      }
    } else {
      // 文字版：粗线蛇身 + 每节一个 char
      var seg=[pts[0]];
      for(k=1;k<pts.length;k++){
        var d=Math.hypot(pts[k].x-pts[k-1].x, pts[k].y-pts[k-1].y);
        if(d>CELL*1.8){ strokeSeg(seg,sn.color,sn.isPlayer); seg=[]; }
        seg.push(pts[k]);
      }
      strokeSeg(seg,sn.color,sn.isPlayer);
      ctx.textAlign="center"; ctx.textBaseline="middle";
      for(k=1;k<pts.length;k++){
        var TX2=pts[k].x, TY2=pts[k].y;
        if(TX2<-CELL||TY2<-CELL||TX2>S+CELL||TY2>SH+CELL) continue;
        var label=THEME.chars[k % THEME.chars.length];
        ctx.font=(CELL*0.46)+"px 'STKaiti','KaiTi','楷体',serif";
        ctx.fillStyle="rgba(255,255,255,.95)"; ctx.fillText(label,TX2,TY2+0.5);
      }
    }
    // 头
    var H=pts[0];
    if(H.x>-CELL&&H.y>-CELL&&H.x<S+CELL&&H.y<SH+CELL){
      ctx.fillStyle=sn.color;
      ctx.strokeStyle=sn.isPlayer?"#d9a441":"rgba(38,38,42,.9)";
      ctx.lineWidth=sn.isPlayer?3:2.4;
      ctx.beginPath(); ctx.arc(H.x,H.y,CELL*0.44,0,6.2832); ctx.fill(); ctx.stroke();
      var er=CELL*0.13, off=CELL*0.22;
      var px=-sn.dir.y, py=sn.dir.x;
      var fx=sn.dir.x*CELL*0.16, fy=sn.dir.y*CELL*0.16;
      var sgns=[1,-1];
      for(k=0;k<2;k++){
        var ex=H.x+fx+px*sgns[k]*off, ey=H.y+fy+py*sgns[k]*off;
        ctx.fillStyle="#fff";
        ctx.beginPath(); ctx.arc(ex,ey,er,0,6.2832); ctx.fill();
        ctx.fillStyle="#20202a";
        ctx.beginPath(); ctx.arc(ex+sn.dir.x*er*0.35, ey+sn.dir.y*er*0.35, er*0.5,0,6.2832); ctx.fill();
      }
      ctx.font="10px sans-serif"; ctx.textAlign="center";
      ctx.fillStyle=sn.isPlayer?sn.color:"rgba(70,66,60,.85)";
      ctx.fillText(sn.name, H.x, H.y-CELL*0.52);
      if(THEME.kind==="metro" && sn.body[0] && sn.body[0].name){
        ctx.font="bold "+(CELL*0.30)+"px 'STKaiti','KaiTi','楷体',sans-serif";
        ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.lineWidth=2.4; ctx.strokeStyle="rgba(255,255,255,.95)"; ctx.strokeText(sn.body[0].name, H.x, H.y-CELL*0.86);
        ctx.fillStyle="rgba(28,28,34,.98)"; ctx.fillText(sn.body[0].name, H.x, H.y-CELL*0.86);
      }
      if(sn.isPlayer && sn.homeGlow>0){
        ctx.font="bold "+(CELL*0.46)+"px 'STKaiti','KaiTi','楷体',sans-serif";
        ctx.fillStyle="rgba(217,164,65,.98)";
        ctx.fillText("建站+1", H.x, H.y+CELL*0.60);
        sn.homeGlow--;
      }
    }
  }
  // 托管提示
  if(player && player.alive && autoMode){
    ctx.textAlign="center"; ctx.textBaseline="top";
    ctx.font="bold "+(CELL*0.5)+"px 'STKaiti','KaiTi','楷体',serif";
    ctx.fillStyle="rgba(31,111,107,.95)";
    ctx.fillText("托管中 · 无敌", S/2, 8);
  }
  // 冲刺提示
  if(player && player.alive && player.boosting){
    ctx.textAlign="right"; ctx.textBaseline="top";
    ctx.font="bold "+(CELL*0.5)+"px 'STKaiti','KaiTi','楷体',serif";
    ctx.fillStyle="rgba(200,69,28,.95)";
    ctx.fillText("加速中", S-8, 8);
  }
  if(hitFlash>0){ ctx.fillStyle="rgba(200,50,30,"+(0.30*hitFlash)+")"; ctx.fillRect(0,0,S,SH); }
  // 地铁版：蛇头靠近「换乘枢纽」时，底部居中提示「可换哪几条线」（帮助记忆线网骨架）
  if(THEME.kind==="metro" && player && player.alive && player.body[0]){
    var ph=player.body[0], hub=null;
    for(i=0;i<food.length;i++){
      var f=food[i];
      if(f.transfer && Math.abs(f.x-ph.x)<=1 && Math.abs(f.y-ph.y)<=1){ hub=f; break; }
    }
    if(hub){
      ctx.textAlign="center"; ctx.textBaseline="top";
      ctx.font="bold "+(CELL*0.50)+"px 'STKaiti','KaiTi','楷体',serif";
      var msg="换乘枢纽 · "+hub.name+" ｜ 可换 "+hub.transfer.join(" / ");
      var bw2=ctx.measureText(msg).width+26, bh2=CELL*0.84;
      var by=SH-CELL*0.9-bh2;
      ctx.fillStyle="rgba(247,215,116,.97)";
      ctx.strokeStyle="#caa23a"; ctx.lineWidth=2;
      roundRect(S/2-bw2/2, by, bw2, bh2, 12); ctx.fill(); ctx.stroke();
      ctx.fillStyle="rgba(60,44,12,.98)"; ctx.fillText(msg, S/2, by+CELL*0.18);
    }
  }
  drawMini();
}

function drawMini(){
  var S=88, mx=S/WCOLS, my=S/WROWS, i, j;
  mctx.clearRect(0,0,S,S);
  mctx.fillStyle="rgba(243,238,227,.85)"; mctx.fillRect(0,0,S,S);
  mctx.fillStyle="#d2542a";
  for(i=0;i<food.length;i++) mctx.fillRect(food[i].x*mx,food[i].y*my,1.3,1.3);
  for(i=0;i<snakes.length;i++){
    var sn=snakes[i]; if(!sn.alive) continue;
    mctx.fillStyle=sn.color;
    for(j=0;j<sn.body.length;j++) mctx.fillRect(sn.body[j].x*mx,sn.body[j].y*my,2,2);
  }
  if(player&&player.alive){
    mctx.fillStyle="#1f6f6b";
    mctx.fillRect(player.body[0].x*mx-1.5, player.body[0].y*my-1.5, 4.5,4.5);
  }
  mctx.strokeStyle="rgba(38,38,42,.45)"; mctx.lineWidth=1;
  var vx=((camX-(VCOLS-1)/2)%WCOLS+WCOLS)%WCOLS, vy=((camY-(VROWS-1)/2)%WROWS+WROWS)%WROWS;
  mctx.strokeRect(vx*mx,vy*my,VCOLS*mx,VROWS*my);
}

/* ===== 排行榜 ===== */
function updateBoard(){
  if(!snakes.length) return;
  var sorted=snakes.slice().sort(function(a,b){return b.score-a.score;});
  rankEl.textContent=(sorted.indexOf(player)+1)+"/"+snakes.length;
  boardEl.innerHTML="";
  var medals=["①","②","③","④","⑤","⑥","⑦"];
  for(var i=0;i<sorted.length;i++){
    var sn=sorted[i];
    var c=document.createElement("div");
    c.className="chip"+(sn.isPlayer?" me":"")+(sn.alive?"":" dead");
    c.innerHTML=(medals[i]||(i+1)+".")+sn.name+"<span class='sc'>"+sn.score+"</span>";
    boardEl.appendChild(c);
  }
  updateHome();
}

/* 地铁版：统计玩家已收集的本线车站（家园进度） */
function computeHome(sn){
  if(!sn || !sn.homeLine) return {built:0,total:0,next:0};
  var st=sn.homeLine.stations, set={}, total=st.length, built=0, next=0, i;
  for(i=0;i<sn.body.length;i++){ if(sn.body[i].name) set[sn.body[i].name]=1; }
  for(i=0;i<total;i++){ if(set[st[i]]) built++; }
  while(next<total && set[st[next]]) next++;
  return {built:built,total:total,next:next};
}
function updateHome(){
  if(THEME.kind!=="metro" || !player || !player.homeLine) return;
  var h=computeHome(player);
  homeEl.textContent=h.built+"/"+h.total;
  if(hpCountEl) hpCountEl.textContent=h.built+"/"+h.total;
}
/* 地铁版左下角图示：10 条线路逐条「点亮」（循环高亮当前线） */
function startLineHi(){
  if(lineHiTimer) return;
  lineHiTimer=setInterval(function(){
    if(THEME.kind!=="metro" || !homeLineRows || !homeLineRows.length) return;
    lineHiIdx=(lineHiIdx+1)%homeLineRows.length;
    for(var i=0;i<homeLineRows.length;i++){
      homeLineRows[i].classList.toggle("lit", i===lineHiIdx);
    }
  }, 520);
}
function buildHomePanel(){
  if(THEME.kind!=="metro" || !player || !player.homeLine){ if(homePanel) homePanel.style.display="none"; return; }
  homePanel.style.display="block"; homePanel.innerHTML="";
  // 头部：家园建设进度（X/N）
  var h4=document.createElement("h4");
  h4.innerHTML="🏠 家园 · "+player.homeLine.name+" <b id='hpCount'>"+homeEl.textContent+"</b>";
  homePanel.appendChild(h4);
  hpCountEl=h4.querySelector("#hpCount")||null;
  // 10 条线路图例：逐条「点亮」
  var leg=document.createElement("div"); leg.className="lp";
  homeLineRows=[];
  for(var i=0;i<THEME.lines.length;i++){
    var lin=THEME.lines[i];
    var row=document.createElement("div"); row.className="lp-row"+(lin===player.homeLine?" home":"");
    var bar=document.createElement("span"); bar.className="lp-bar"; bar.style.background=lin.color;
    var nm=document.createElement("span"); nm.className="lp-name";
    nm.textContent=lin.name + (lin===player.homeLine ? "  ⌂" : "");
    row.appendChild(bar); row.appendChild(nm);
    leg.appendChild(row); homeLineRows.push(row);
  }
  homePanel.appendChild(leg);
  updateHome();
  startLineHi();
}

/* ===== 主循环 ===== */
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(64, now-lastTime); lastTime=now;
  if(running&&!paused){
    // 加速：双击/连点触发的一次冲刺；节奏恒定，只有玩家每拍多走一步
    if(player){
      if(boostHeld) boostUntil=performance.now()+BOOST_MS;
      player.boosting = (performance.now() < boostUntil);
    }
    tickMs = TICK;
    var guard=0;
    while(now-lastTick>=tickMs && guard++<4){ lastTick+=tickMs; tick(now); }
    alpha=clamp((now-lastTick)/tickMs,0,1);
    if(hitFlash>0) hitFlash=Math.max(0,hitFlash-dt/420);
    updateCam();
    draw(alpha);
  } else if(snakes.length){
    draw(alpha);
  }
}

/* ===== 控制 ===== */
function setDir(nx,ny){
  if(!player||!player.alive) return;
  if(autoMode) setAuto(false);              // 手动介入 → 立即退出托管
  if(player.dir.x===-nx&&player.dir.y===-ny) return;
  player.nextDir={x:nx,y:ny};
}
var lastDirKey="", lastDirTime=0;
window.addEventListener("keydown",function(e){
  var k=e.key.toLowerCase(), dk="";
  if(k==="arrowup"||k==="w"){setDir(0,-1);dk="u";e.preventDefault();}
  else if(k==="arrowdown"||k==="s"){setDir(0,1);dk="d";e.preventDefault();}
  else if(k==="arrowleft"||k==="a"){setDir(-1,0);dk="l";e.preventDefault();}
  else if(k==="arrowright"||k==="d"){setDir(1,0);dk="r";e.preventDefault();}
  else if(k===" "){togglePause();e.preventDefault();}
  else if(k==="shift"){ triggerBoost(); }               // 备用：Shift 也能冲刺
  if(dk){                                              // 连按两次同一方向键 = 冲刺
    var kNow=performance.now();
    if(dk===lastDirKey && kNow-lastDirTime<DOUBLE_TAP_MS){ triggerBoost(); lastDirTime=0; }
    else { lastDirKey=dk; lastDirTime=kNow; }
  }
});
window.addEventListener("keyup",function(e){ if(e.key.toLowerCase()==="shift") boostHeld=false; });
var dirBtns=document.querySelectorAll(".pad button[data-dir]");
for(var i=0;i<dirBtns.length;i++){
  (function(b){
    b.addEventListener("click",function(){
      var d=b.getAttribute("data-dir");
      if(d==="up")setDir(0,-1); else if(d==="down")setDir(0,1);
      else if(d==="left")setDir(-1,0); else if(d==="right")setDir(1,0);
    });
  })(dirBtns[i]);
}
var boostBtn=document.getElementById("boostBtn");
function triggerBoost(){ if(!player||!player.alive) return; boostUntil=performance.now()+BOOST_MS; }
function startBoost(e){ if(e)e.preventDefault(); boostHeld=true; triggerBoost(); }
function endBoost(e){ if(e)e.preventDefault(); boostHeld=false; }
boostBtn.addEventListener("touchstart",startBoost,{passive:false});
boostBtn.addEventListener("touchend",endBoost,{passive:false});
boostBtn.addEventListener("touchcancel",endBoost,{passive:false});
boostBtn.addEventListener("mousedown",startBoost);
boostBtn.addEventListener("mouseup",endBoost);
boostBtn.addEventListener("mouseleave",endBoost);

/* ===== 虚拟摇杆：画布上任意位置按下即出现 ===== */
var stage=document.querySelector(".stage");
var stick=document.getElementById("stick"), stickKnob=document.getElementById("stickKnob");
var STICK_R=45, stickOn=false, stickCX=0, stickCY=0, lastMove=0;
// 屏幕坐标 → 画面坐标（强制横屏时画面被 rotate(90deg)，需逆旋转换算）
function toLocal(cx,cy){
  var r=stage.getBoundingClientRect();
  if(!forceRotate) return {x:cx-r.left, y:cy-r.top};
  var ox=cx-(r.left+r.width/2), oy=cy-(r.top+r.height/2);
  return {x:r.height/2+oy, y:r.width/2-ox};
}
function showStick(px,py){
  stickOn=true; stickCX=px; stickCY=py;
  stick.style.left=px+"px"; stick.style.top=py+"px";
  stickKnob.style.transform="translate(0px,0px)";
  stick.classList.add("on");
}
function moveStick(px,py,now){
  if(!stickOn) return;
  var dx=px-stickCX, dy=py-stickCY;
  var len=Math.sqrt(dx*dx+dy*dy);
  if(len>STICK_R){ dx=dx/len*STICK_R; dy=dy/len*STICK_R; }
  stickKnob.style.transform="translate("+dx+"px,"+dy+"px)";
  if(Math.sqrt(dx*dx+dy*dy)<12) return;            // 死区，防手抖
  if(now-lastMove<70) return;                      // 转向节流，避免抖动
  if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0);
  else setDir(0,dy>0?1:-1);
  lastMove=now;
}
function hideStick(){ stickOn=false; stick.classList.remove("on"); }

var tapX=0, tapY=0, lastTapT=0;
canvas.addEventListener("touchstart",function(e){
  var t=e.touches[0], p=toLocal(t.clientX,t.clientY);
  showStick(p.x, p.y);
  tapX=t.clientX; tapY=t.clientY;
},{passive:true});
canvas.addEventListener("touchmove",function(e){
  var t=e.touches[0], p=toLocal(t.clientX,t.clientY);
  moveStick(p.x, p.y, performance.now());
  e.preventDefault();
},{passive:false});
canvas.addEventListener("touchend",function(e){
  hideStick();
  var t=e.changedTouches && e.changedTouches[0];
  if(!t) return;
  if(Math.hypot(t.clientX-tapX, t.clientY-tapY) < 12){   // 是「点」不是「拖」
    var now=performance.now();
    if(now-lastTapT<DOUBLE_TAP_MS){ triggerBoost(); lastTapT=0; }   // 连点两下 = 冲刺
    else lastTapT=now;
  }
},{passive:true});
canvas.addEventListener("touchcancel",hideStick,{passive:true});
// 桌面用鼠标拖动也能摇
canvas.addEventListener("mousedown",function(e){
  var p=toLocal(e.clientX,e.clientY);
  showStick(p.x,p.y);
  isMouseDragging=true;
});
canvas.addEventListener("mousemove",function(e){
  if(!isMouseDragging) return;
  var p=toLocal(e.clientX,e.clientY);
  moveStick(p.x,p.y,performance.now());
});
window.addEventListener("mouseup",function(){ if(isMouseDragging){ isMouseDragging=false; hideStick(); } });
var isMouseDragging=false;

// 触摸设备：隐藏方向键盘
if(("ontouchstart" in window) || navigator.maxTouchPoints>0) document.body.classList.add("touch");

  document.getElementById("pickerTitle").textContent="选择城市";
  var keys=Object.keys(THEMES).filter(function(k){return THEMES[k].kind==="metro";});
  for(var i=0;i<keys.length;i++){
    (function(key){
      var t=THEMES[key];
      var b=document.createElement("button");
      b.className="line-chip"+(key===THEME.id?" cur":"");
      b.innerHTML='<span class="sw" style="background:'+(t.lines[0]?t.lines[0].color:"#888")+'"></span>'+t.label;
      b.addEventListener("click",function(){
        try{ history.replaceState(null,"",location.pathname+"?theme="+key); }catch(e){}
        location.search="?theme="+key;
      });
      grid.appendChild(b);
    })(keys[i]);
  }
  document.getElementById("linePicker").classList.remove("hidden");
}
document.getElementById("switchLineBtn").addEventListener("click",openLinePicker);
document.getElementById("switchCityBtn").addEventListener("click",openCityPicker);
document.getElementById("linePickerClose").addEventListener("click",function(){ document.getElementById("linePicker").classList.add("hidden"); });

/* 全屏：CSS 撑满（在 iframe 预览里也生效）+ 原生全屏 API 增强 */
var orientLocked=false, forceRotate=false;
function lockLandscape(){          // 优先用原生横屏锁定（Android Chrome 全屏下可用）
  orientLocked=false;
  try{
    var s=window.screen;
    var so=s && (s.orientation||s.msOrientation||s.mozOrientation);
    if(so && so.lock){ so.lock("landscape").then(function(){orientLocked=true;updateOrientation();}).catch(function(){}); return; }
    if(s && s.lockOrientation){ s.lockOrientation("landscape"); orientLocked=true; return; }
  }catch(e){}
}
function unlockLandscape(){
  try{
    var s=window.screen;
    var so=s && (s.orientation||s.msOrientation||s.mozOrientation);
    if(so && so.unlock) so.unlock();
    else if(s && s.unlockOrientation) s.unlockOrientation();
  }catch(e){}
  orientLocked=false;
}
function updateOrientation(){       // 竖屏且没锁住 → 用 CSS 把画面转 90° 变横屏
  var portrait=(window.innerHeight||0)>(window.innerWidth||0);
  var want=!!(fsMode && portrait && !orientLocked);
  if(want!==forceRotate){
    forceRotate=want;
    document.body.classList.toggle("fs-rot", want);
  }
  resize();
  setTimeout(function(){ resize(); if(!running) draw(0); },120);
}

var fsMode=false;
function setFs(on){
  fsMode=on;
  document.body.classList.toggle("fs", on);
  document.getElementById("fsBtn").textContent = on?"退出全屏":"全屏";
  document.getElementById("fsFloatBtn").textContent = on?"退出":"全屏";
  try{
    if(on){
      if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
      setTimeout(lockLandscape,150);        // 需先进入全屏才能锁方向
    } else if(document.fullscreenElement && document.exitFullscreen){
      document.exitFullscreen(); unlockLandscape();
    }
  }catch(e){}
  updateOrientation();
  resize();                                   // 立即重算，避免这几百毫秒内位图与 CSS 不匹配而拉伸
  setTimeout(function(){ resize(); if(!running) draw(0); },350);
  setTimeout(function(){ resize(); if(!running) draw(0); },900);   // 布局稳定后再兜一次
}
document.getElementById("fsBtn").addEventListener("click",function(){ setFs(!fsMode); });
document.getElementById("fsFloatBtn").addEventListener("click",function(){ setFs(!fsMode); });
// 双击已用于「冲刺加速」，全屏改由按钮触发
document.addEventListener("fullscreenchange",function(){
  setTimeout(function(){ resize(); if(!running) draw(0); },300);
});

/* ===== 主题应用到界面 ===== */
function applyTheme(){
  document.title = THEME.title;
  document.getElementById("pageH1").textContent = THEME.title;
  document.getElementById("ovH2").textContent = THEME.label + " · 开放世界";
  document.getElementById("ovIntro").innerHTML = THEME.intro;
  document.getElementById("pageFoot").textContent = THEME.foot;
  var isMetro = THEME.kind==="metro";
  document.getElementById("homeWrap").classList.toggle("show", isMetro);
  if(!isMetro && homePanel) homePanel.style.display="none";
}

applyTheme();
resize(); reset(); setMode("open"); lastTime=performance.now(); draw(0);
requestAnimationFrame(frame);
})();
