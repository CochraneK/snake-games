<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>苏络贪吃蛇 · 开放世界</title>
<style>
  :root{
    --paper:#f4efe4;
    --paper-2:#ece4d4;
    --ink:#2b2b2b;
    --ink-soft:#5a5650;
    --teal:#1f6f6b;
    --teal-2:#2f9b95;
    --accent:#c8702f;
    --line:#d8cfbd;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    background:radial-gradient(circle at 50% 0%, #faf6ec 0%, var(--paper) 55%, var(--paper-2) 100%);
    color:var(--ink);
    font-family:"STKaiti","KaiTi","Kaiti SC","楷体",serif;
    display:flex;flex-direction:column;align-items:center;
    padding:10px 10px 24px;
  }
  h1{font-size:24px;letter-spacing:6px;margin:4px 0 1px;font-weight:700;}
  .subtitle{font-size:12px;color:var(--ink-soft);letter-spacing:1px;margin-bottom:8px;text-align:center;}
  .hud{display:flex;gap:16px;align-items:center;justify-content:center;font-size:14px;color:var(--ink-soft);margin-bottom:6px;}
  .hud b{color:var(--teal);font-size:18px;margin-left:3px;font-family:inherit;}
  .board{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px;margin-bottom:8px;}
  .chip{font-size:12px;padding:3px 9px;border-radius:14px;background:#fff;border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap;}
  .chip.me{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700;}
  .chip .sc{font-weight:700;margin-left:3px;}
  .stage{position:relative;width:min(94vw,560px);}
  canvas#game{
    width:100%;height:auto;aspect-ratio:1/1;display:block;background:var(--paper);
    border:2px solid var(--line);border-radius:10px;
    box-shadow:0 10px 28px rgba(60,50,30,.16), inset 0 0 0 6px rgba(255,255,255,.35);
    touch-action:none;
  }
  canvas#mini{position:absolute;right:8px;bottom:8px;width:96px;height:96px;border-radius:8px;
    border:1px solid var(--line);background:rgba(244,239,228,.82);box-shadow:0 3px 8px rgba(0,0,0,.18);}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;text-align:center;background:rgba(244,239,228,.88);border-radius:10px;padding:18px;}
  .overlay.hidden{display:none;}
  .overlay h2{margin:0;font-size:22px;letter-spacing:3px;}
  .overlay p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.8;max-width:300px;}
  .overlay .big{font-size:20px;color:var(--accent);}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:24px;padding:9px 22px;font-size:15px;
    letter-spacing:2px;color:#fff;background:linear-gradient(180deg,var(--teal-2),var(--teal));
    box-shadow:0 4px 0 #14524f,0 6px 12px rgba(0,0,0,.15);transition:transform .06s,box-shadow .06s;}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #14524f,0 3px 8px rgba(0,0,0,.15);}
  .pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:8px;margin-top:14px;}
  .pad button{padding:0;border-radius:12px;font-size:22px;box-shadow:0 3px 0 #14524f;background:linear-gradient(180deg,var(--teal-2),var(--teal));}
  .pad .up{grid-column:2;grid-row:1;}
  .pad .left{grid-column:1;grid-row:2;}
  .pad .down{grid-column:2;grid-row:2;}
  .pad .right{grid-column:3;grid-row:2;}
  .pad .mid{grid-column:2;grid-row:3;background:linear-gradient(180deg,#b9ab8c,#9c8d6c);box-shadow:0 3px 0 #6f6248;font-size:13px;}
  .hint{font-size:11px;color:var(--ink-soft);margin-top:12px;letter-spacing:1px;text-align:center;line-height:1.7;max-width:340px;}
  .foot{margin-top:14px;font-size:11px;color:var(--ink-soft);letter-spacing:1px;}
  @media (max-width:420px){ h1{font-size:21px;} .pad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);} }
</style>
</head>
<body>
  <h1>苏络贪吃蛇 · 开放世界</h1>
  <div class="subtitle">大地图 · 多蛇竞争 · 不撞死 · 吃得越多越长</div>

  <div class="hud">
    <div>得分 <b id="score">0</b></div>
    <div>最高 <b id="best">0</b></div>
    <div>排名 <b id="rank">-</b></div>
  </div>
  <div class="board" id="board"></div>

  <div class="stage">
    <canvas id="game"></canvas>
    <canvas id="mini" width="96" height="96"></canvas>
    <div class="overlay" id="startOverlay">
      <h2>苏络 · 开放世界</h2>
      <p>大地图里有多条「苏络」蛇在抢食。<br>你<b>不会撞死</b>——只管追着「苏」「络」吃，<br>和对手比谁更长！</p>
      <button id="startBtn">开始游走</button>
    </div>
    <div class="overlay hidden" id="pauseOverlay">
      <h2>已暂停</h2>
      <p>当前得分 <span class="big" id="pauseScore">0</span></p>
      <button id="resumeBtn">继续</button>
      <button id="restartBtn" style="background:linear-gradient(180deg,#b9ab8c,#9c8d6c);box-shadow:0 4px 0 #6f6248;">重新开始</button>
    </div>
  </div>

  <div class="pad" aria-label="方向控制">
    <button class="up" data-dir="up">↑</button>
    <button class="left" data-dir="left">←</button>
    <button class="down" data-dir="down">↓</button>
    <button class="right" data-dir="right">→</button>
    <button class="mid" id="pauseBtn">暂停</button>
  </div>

  <div class="hint">方向键 / WASD / 滑动屏幕控制 · 空格暂停<br>相机始终跟随你 · 右下角为世界缩略图</div>
  <div class="foot">苏络 · Su Luo Snake — 开放世界版</div>

<script>
(function(){
  "use strict";
  // ===== 配置 =====
  const WCOLS = 60, WROWS = 60;          // 大世界格子数
  const VIEW = 23;                       // 视口格子数（奇数，玩家居中）
  const CELL = 30;                       // 逻辑像素/格
  const FOOD_TARGET = 110;               // 世界中常驻食物数量
  const BOT_COUNT = 6;                   // 竞争对手数量
  const STEP0 = 130;                     // 初始步长(ms)

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const mini = document.getElementById("mini");
  const mctx = mini.getContext("2d");
  const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  const W = VIEW * CELL, H = VIEW * CELL;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const rankEl = document.getElementById("rank");
  const boardEl = document.getElementById("board");
  const startOverlay = document.getElementById("startOverlay");
  const pauseOverlay = document.getElementById("pauseOverlay");
  const pauseScoreEl = document.getElementById("pauseScore");

  let world, snakes, food, score, best, stepMs, running, paused;
  best = parseInt(localStorage.getItem("suluo_best") || "0", 10) || 0;
  bestEl.textContent = best;

  const BOT_DEFS = [
    {name:"赤蛇", color:"#c0392b"},
    {name:"橙蛇", color:"#d98324"},
    {name:"碧蛇", color:"#27ae60"},
    {name:"蓝蛇", color:"#2e86c1"},
    {name:"紫蛇", color:"#7d5ba6"},
    {name:"黛蛇", color:"#566573"}
  ];

  // 环绕距离（处理大地图边界）
  function wdx(a,b,n){ let d=(b-a+n)%n; if(d>n/2) d-=n; return d; }

  function randCell(){ return { x:(Math.random()*WCOLS)|0, y:(Math.random()*WROWS)|0 }; }

  function occupiedSet(){ // 所有蛇身占用的格子
    const s = new Set();
    for(const sn of snakes) for(const c of sn.body) s.add(c.x+","+c.y);
    return s;
  }

  function spawnFood(n){
    const occ = occupiedSet();
    for(let i=0;i<n;i++){
      let c, guard=0;
      do{ c = randCell(); guard++; }while(occ.has(c.x+","+c.y) && guard<50);
      occ.add(c.x+","+c.y);
      food.push({ x:c.x, y:c.y, ch: Math.random()<0.5?"苏":"络" });
    }
  }

  function makeSnake(opts){
    const c = randCell();
    const len = 4;
    const body = [];
    const dir = opts.dir || {x:1,y:0};
    for(let i=0;i<len;i++) body.push({ x:(c.x - dir.x*i + WCOLS)%WCOLS, y:(c.y - dir.y*i + WROWS)%WROWS });
    return { id:opts.id, name:opts.name, color:opts.color, isPlayer:!!opts.isPlayer,
             body, dir, nextDir:dir, score:0, blocked:false };
  }

  function reset(){
    food = [];
    snakes = [];
    snakes.push(makeSnake({ id:0, name:"你·苏络", color:"#1f6f6b", isPlayer:true }));
    for(let i=0;i<BOT_COUNT;i++){
      const d = BOT_DEFS[i % BOT_DEFS.length];
      snakes.push(makeSnake({ id:i+1, name:d.name, color:d.color }));
    }
    score = 0; stepMs = STEP0;
    scoreEl.textContent = "0"; rankEl.textContent = "-";
    spawnFood(FOOD_TARGET);
  }

  // ===== AI：朝最近食物走，不反向 =====
  function botThink(sn){
    let bestF = null, bestD = 1e9;
    const h = sn.body[0];
    for(const f of food){
      const d = wdx(h.x,f.x,WCOLS)**2 + wdx(h.y,f.y,WROWS)**2;
      if(d < bestD){ bestD = d; bestF = f; }
    }
    const opts = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}]
      .filter(o => !(o.x === -sn.dir.x && o.y === -sn.dir.y));
    if(!bestF){ sn.nextDir = opts[(Math.random()*opts.length)|0]; return; }
    let pick = sn.dir, pd = 1e9;
    for(const o of opts){
      const nx = (h.x+o.x+WCOLS)%WCOLS, ny = (h.y+o.y+WROWS)%WROWS;
      const d = wdx(nx,bestF.x,WCOLS)**2 + wdx(ny,bestF.y,WROWS)**2;
      if(d < pd){ pd = d; pick = o; }
    }
    sn.nextDir = pick;
  }

  function step(){
    for(const sn of snakes){
      if(!sn.isPlayer) botThink(sn);
      sn.dir = sn.nextDir;
      const h = sn.body[0];
      const nh = { x:(h.x+sn.dir.x+WCOLS)%WCOLS, y:(h.y+sn.dir.y+WROWS)%WROWS };
      // 非致命：若目标格被别的蛇身占着，这一拍原地不动（不死亡）
      let blocked = false;
      for(const other of snakes){
        if(other === sn) continue;
        for(const c of other.body){ if(c.x===nh.x && c.y===nh.y){ blocked = true; break; } }
        if(blocked) break;
      }
      sn.blocked = blocked;
      if(blocked) continue; // 不动，也不吃
      sn.body.unshift(nh);
      // 吃食物
      let ate = -1;
      for(let i=0;i<food.length;i++){
        if(food[i].x===nh.x && food[i].y===nh.y){ ate = i; break; }
      }
      if(ate >= 0){
        food.splice(ate,1);
        sn.score++;
        if(sn.isPlayer){
          score = sn.score; scoreEl.textContent = score;
          if(score > best){ best = score; bestEl.textContent = best; localStorage.setItem("suluo_best", String(best)); }
          stepMs = Math.max(75, stepMs - 2);
        }
      } else {
        sn.body.pop();
      }
    }
    // 补满食物
    if(food.length < FOOD_TARGET) spawnFood(FOOD_TARGET - food.length);
    updateBoard();
  }

  // ===== 渲染 =====
  function draw(){
    const me = snakes[0];
    const hc = me.body[0];
    ctx.fillStyle = "#f4efe4"; ctx.fillRect(0,0,W,H);
    // 网格
    ctx.strokeStyle = "rgba(160,148,120,.16)"; ctx.lineWidth = 1;
    for(let i=1;i<VIEW;i++){ ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,H);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(W,i*CELL);ctx.stroke(); }

    const cx = (VIEW-1)/2;
    // 食物（相对玩家）
    ctx.font = (CELL-12)+"px 'STKaiti','KaiTi','楷体',serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    for(const f of food){
      const dx = wdx(hc.x, f.x, WCOLS), dy = wdx(hc.y, f.y, WROWS);
      const vx = cx + dx, vy = cx + dy;
      if(vx<-0.5||vy<-0.5||vx>VIEW-0.5||vy>VIEW-0.5) continue;
      drawCell(vx, vy, f.ch, "#c8702f", "#f6e2cf", true, false);
    }
    // 蛇
    for(const sn of snakes){
      for(let i=sn.body.length-1;i>=0;i--){
        const c = sn.body[i];
        const dx = wdx(hc.x, c.x, WCOLS), dy = wdx(hc.y, c.y, WROWS);
        const vx = cx + dx, vy = cx + dy;
        if(vx<-0.5||vy<-0.5||vx>VIEW-0.5||vy>VIEW-0.5) continue;
        const ch = (i%2===0)?"苏":"络";
        if(i===0) drawCell(vx, vy, ch, sn.color, "#fff", true, true, sn.name);
        else drawCell(vx, vy, ch, sn.color, tint(sn.color), false);
      }
    }
    drawMini(me);
  }

  function tint(hex){
    // 蛇身底色：用蛇色淡化
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},0.16)`;
  }

  function drawCell(vx, vy, ch, ink, bg, warm, isHead, label){
    const x = vx*CELL, y = vy*CELL, pad = 3;
    ctx.fillStyle = bg;
    roundRect(x+pad, y+pad, CELL-pad*2, CELL-pad*2, isHead?9:7); ctx.fill();
    if(isHead){ ctx.strokeStyle = ink; ctx.lineWidth = 2.5;
      roundRect(x+pad, y+pad, CELL-pad*2, CELL-pad*2, 9); ctx.stroke(); }
    ctx.fillStyle = ink;
    ctx.font = (isHead?(CELL-8):(CELL-12))+"px 'STKaiti','KaiTi','楷体',serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(ch, x+CELL/2, y+CELL/2+1);
    if(label){
      ctx.fillStyle = ink; ctx.font = "11px sans-serif";
      ctx.fillText(label, x+CELL/2, y+1);
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  }

  function drawMini(me){
    const S = 96, sx = S/WCOLS, sy = S/WROWS;
    mctx.clearRect(0,0,S,S);
    mctx.fillStyle = "rgba(244,239,228,.9)"; mctx.fillRect(0,0,S,S);
    // 食物
    mctx.fillStyle = "#c8702f";
    for(const f of food) mctx.fillRect(f.x*sx, f.y*sy, 1.4, 1.4);
    // 蛇
    for(const sn of snakes){
      mctx.fillStyle = sn.color;
      for(const c of sn.body) mctx.fillRect(c.x*sx, c.y*sy, 2, 2);
    }
    mctx.fillStyle = "#1f6f6b";
    const h = me.body[0]; mctx.fillRect(h.x*sx-1, h.y*sy-1, 4, 4);
    // 视口框
    const vx = (h.x - (VIEW-1)/2 + WCOLS)%WCOLS, vy = (h.y - (VIEW-1)/2 + WROWS)%WROWS;
    mctx.strokeStyle = "rgba(43,43,43,.5)"; mctx.lineWidth=1;
    mctx.strokeRect((vx*sx+S)%S, (vy*sy+S)%S, VIEW*sx, VIEW*sy);
  }

  // ===== 排行榜 =====
  function updateBoard(){
    const sorted = snakes.slice().sort((a,b)=>b.score-a.score);
    let myRank = sorted.indexOf(snakes[0]) + 1;
    rankEl.textContent = myRank + "/" + snakes.length;
    boardEl.innerHTML = "";
    sorted.forEach((sn,i)=>{
      const c = document.createElement("div");
      c.className = "chip" + (sn.isPlayer?" me":"");
      const medal = ["①","②","③","④","⑤","⑥","⑦"][i] || (i+1)+".";
      c.innerHTML = medal + sn.name + "<span class='sc'>"+sn.score+"</span>";
      boardEl.appendChild(c);
    });
  }

  // ===== 主循环 =====
  let timer=null;
  function loop(){
    if(running && !paused){
      step();
      draw();
    }
    timer = setTimeout(loop, stepMs);
  }

  // ===== 控制 =====
  function setDir(nx,ny){
    const sn = snakes && snakes[0]; if(!sn) return;
    if(sn.dir.x === -nx && sn.dir.y === -ny) return;
    sn.nextDir = {x:nx,y:ny};
  }
  window.addEventListener("keydown", function(e){
    const k = e.key.toLowerCase();
    if(k==="arrowup"||k==="w"){ setDir(0,-1); e.preventDefault(); }
    else if(k==="arrowdown"||k==="s"){ setDir(0,1); e.preventDefault(); }
    else if(k==="arrowleft"||k==="a"){ setDir(-1,0); e.preventDefault(); }
    else if(k==="arrowright"||k==="d"){ setDir(1,0); e.preventDefault(); }
    else if(k===" "){ togglePause(); e.preventDefault(); }
  });
  document.querySelectorAll(".pad button[data-dir]").forEach(b=>{
    b.addEventListener("click", ()=>{ const d=b.getAttribute("data-dir");
      if(d==="up")setDir(0,-1); else if(d==="down")setDir(0,1);
      else if(d==="left")setDir(-1,0); else if(d==="right")setDir(1,0); });
  });
  document.getElementById("pauseBtn").addEventListener("click", togglePause);
  let tsx=0,tsy=0;
  canvas.addEventListener("touchstart", e=>{ const t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; }, {passive:true});
  canvas.addEventListener("touchend", e=>{
    const t=e.changedTouches[0]; const dx=t.clientX-tsx, dy=t.clientY-tsy;
    if(Math.abs(dx)<16 && Math.abs(dy)<16) return;
    if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0); else setDir(0,dy>0?1:-1);
  }, {passive:true});

  function togglePause(){
    if(!running) return;
    paused = !paused;
    document.getElementById("pauseBtn").textContent = paused?"继续":"暂停";
    if(paused){ pauseScoreEl.textContent = score; pauseOverlay.classList.remove("hidden"); }
    else pauseOverlay.classList.add("hidden");
  }
  function startGame(){
    reset(); running=true; paused=false;
    document.getElementById("pauseBtn").textContent="暂停";
    startOverlay.classList.add("hidden"); pauseOverlay.classList.add("hidden");
    updateBoard(); draw();
  }
  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("resumeBtn").addEventListener("click", togglePause);
  document.getElementById("restartBtn").addEventListener("click", startGame);

  // 初始静态画面
  reset(); running=false; draw(); updateBoard();
  loop();
})();
</script>
</body>
</html>
