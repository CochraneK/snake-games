<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>苏络贪吃蛇</title>
<style>
  :root{
    --paper:#f4efe4;        /* 宣纸底色 */
    --paper-2:#ece4d4;
    --ink:#2b2b2b;          /* 墨色 */
    --ink-soft:#5a5650;
    --teal:#1f6f6b;         /* 青 */
    --teal-2:#2f9b95;
    --accent:#c8702f;       /* 朱砂 */
    --gold:#d9a441;
    --line:#d8cfbd;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:radial-gradient(circle at 50% 0%, #faf6ec 0%, var(--paper) 55%, var(--paper-2) 100%);
    color:var(--ink);
    font-family:"STKaiti","KaiTi","Kaiti SC","楷体",serif;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    min-height:100%;padding:18px 12px 30px;-webkit-tap-highlight-color:transparent;
  }
  h1{
    font-size:30px;letter-spacing:8px;margin:6px 0 2px;font-weight:700;
    color:var(--ink);text-shadow:0 1px 0 #fff;
  }
  .subtitle{font-size:13px;color:var(--ink-soft);letter-spacing:2px;margin-bottom:14px;}
  .hud{
    display:flex;gap:14px;align-items:center;justify-content:center;margin-bottom:12px;
    font-size:15px;color:var(--ink-soft);
  }
  .hud b{color:var(--teal);font-size:20px;margin-left:4px;font-family:inherit;}
  .stage{position:relative;}
  canvas{
    background:var(--paper);
    border:2px solid var(--line);
    border-radius:10px;
    box-shadow:0 10px 28px rgba(60,50,30,.16), inset 0 0 0 6px rgba(255,255,255,.35);
    touch-action:none;display:block;
  }
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;text-align:center;
    background:rgba(244,239,228,.86);border-radius:10px;backdrop-filter:blur(2px);
    padding:20px;
  }
  .overlay.hidden{display:none;}
  .overlay h2{margin:0;font-size:26px;letter-spacing:4px;color:var(--ink);}
  .overlay p{margin:0;font-size:14px;color:var(--ink-soft);line-height:1.8;max-width:280px;}
  .overlay .big{font-size:22px;color:var(--accent);}
  button{
    font-family:inherit;cursor:pointer;border:none;border-radius:24px;
    padding:10px 26px;font-size:16px;letter-spacing:2px;color:#fff;
    background:linear-gradient(180deg,var(--teal-2),var(--teal));
    box-shadow:0 4px 0 #14524f,0 6px 12px rgba(0,0,0,.15);transition:transform .06s,box-shadow .06s;
  }
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #14524f,0 3px 8px rgba(0,0,0,.15);}
  .pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);
    gap:8px;margin-top:16px;}
  .pad button{padding:0;border-radius:12px;font-size:22px;box-shadow:0 3px 0 #14524f;}
  .pad .up{grid-column:2;grid-row:1;}
  .pad .left{grid-column:1;grid-row:2;}
  .pad .down{grid-column:2;grid-row:2;}
  .pad .right{grid-column:3;grid-row:2;}
  .pad .mid{grid-column:2;grid-row:3;background:linear-gradient(180deg,#b9ab8c,#9c8d6c);box-shadow:0 3px 0 #6f6248;font-size:14px;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:14px;letter-spacing:1px;text-align:center;line-height:1.7;max-width:320px;}
  .foot{margin-top:18px;font-size:12px;color:var(--ink-soft);letter-spacing:1px;}
  a{color:var(--teal);}
</style>
</head>
<body>
  <h1>苏络贪吃蛇</h1>
  <div class="subtitle">蛇身是「苏络」，吃下的也是「苏」「络」</div>

  <div class="hud">
    <div>得分 <b id="score">0</b></div>
    <div>最高 <b id="best">0</b></div>
  </div>

  <div class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="startOverlay">
      <h2>苏络贪吃蛇</h2>
      <p>用 <span class="big">方向键 / WASD</span> 或滑动屏幕控制蛇。<br>
         蛇身由「苏」「络」二字连成，<br>吃到「苏」或「络」即可变长。</p>
      <button id="startBtn">开始游戏</button>
    </div>
    <div class="overlay hidden" id="overOverlay">
      <h2>游戏结束</h2>
      <p>本局得分 <span class="big" id="finalScore">0</span></p>
      <button id="retryBtn">再来一局</button>
    </div>
  </div>

  <div class="pad" aria-label="方向控制">
    <button class="up" data-dir="up">↑</button>
    <button class="left" data-dir="left">←</button>
    <button class="down" data-dir="down">↓</button>
    <button class="right" data-dir="right">→</button>
    <button class="mid" id="pauseBtn">暂停</button>
  </div>

  <div class="hint">空格键暂停 / 继续 · 蛇头碰到身体或边界即结束</div>
  <div class="foot">苏络 · Su Luo Snake</div>

<script>
(function(){
  "use strict";
  const COLS = 19, ROWS = 19, CELL = 38;
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  const W = COLS * CELL, H = ROWS * CELL;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.scale(dpr, dpr);

  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const startOverlay = document.getElementById("startOverlay");
  const overOverlay = document.getElementById("overOverlay");
  const finalScoreEl = document.getElementById("finalScore");

  let snake, dir, nextDir, food, score, best, timer, stepMs, running, alive, paused;
  best = parseInt(localStorage.getItem("suluo_best") || "0", 10) || 0;
  bestEl.textContent = best;

  function reset(){
    const cx = Math.floor(COLS/2), cy = Math.floor(ROWS/2);
    snake = [ {x:cx,y:cy}, {x:cx-1,y:cy}, {x:cx-2,y:cy} ];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    score = 0; stepMs = 150; paused = false;
    scoreEl.textContent = "0";
    placeFood();
  }

  function placeFood(){
    const occupied = new Set(snake.map(s => s.x + "," + s.y));
    let spot;
    do{
      spot = { x: (Math.random()*COLS)|0, y: (Math.random()*ROWS)|0 };
    } while(occupied.has(spot.x + "," + spot.y));
    food = { x: spot.x, y: spot.y, ch: Math.random() < 0.5 ? "苏" : "络" };
  }

  function setDir(nx, ny){
    // 禁止 180° 反向
    if(dir.x === -nx && dir.y === -ny) return;
    nextDir = {x:nx, y:ny};
  }

  function step(){
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    // 撞墙
    if(head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS){ return gameOver(); }
    // 撞自身
    for(let i=0;i<snake.length;i++){
      if(snake[i].x === head.x && snake[i].y === head.y) return gameOver();
    }
    snake.unshift(head);
    if(head.x === food.x && head.y === food.y){
      score++;
      scoreEl.textContent = score;
      if(score > best){ best = score; bestEl.textContent = best; localStorage.setItem("suluo_best", String(best)); }
      // 吃一个加速一点（有下限）
      stepMs = Math.max(70, stepMs - 3);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function draw(){
    // 背景
    ctx.fillStyle = "#f4efe4";
    ctx.fillRect(0,0,W,H);
    // 网格
    ctx.strokeStyle = "rgba(160,148,120,.20)";
    ctx.lineWidth = 1;
    for(let i=1;i<COLS;i++){
      ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(W,i*CELL); ctx.stroke();
    }
    // 食物
    drawCell(food.x, food.y, food.ch, "#c8702f", "#f6e2cf", true);
    // 蛇身
    for(let i = snake.length-1; i >= 0; i--){
      const s = snake[i];
      const ch = (i % 2 === 0) ? "苏" : "络";
      if(i === 0){
        drawCell(s.x, s.y, ch, "#1f6f6b", "#bfe6e3", true, true);
      } else {
        drawCell(s.x, s.y, ch, "#2b2b2b", "#e7dcc4", false);
      }
    }
  }

  function drawCell(gx, gy, ch, inkColor, bgColor, warm, isHead){
    const x = gx*CELL, y = gy*CELL;
    const pad = 3;
    // 底块
    ctx.fillStyle = bgColor;
    roundRect(x+pad, y+pad, CELL-pad*2, CELL-pad*2, isHead?9:7);
    ctx.fill();
    if(isHead){
      ctx.strokeStyle = inkColor; ctx.lineWidth = 2.5;
      roundRect(x+pad, y+pad, CELL-pad*2, CELL-pad*2, 9); ctx.stroke();
    }
    // 字
    ctx.fillStyle = inkColor;
    ctx.font = (isHead? (CELL-8) : (CELL-12)) + "px 'STKaiti','KaiTi','楷体',serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(ch, x + CELL/2, y + CELL/2 + 1);
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function loop(){
    if(running && alive && !paused){
      step();
      draw();
    }
    timer = setTimeout(loop, stepMs);
  }

  function startGame(){
    reset();
    alive = true; running = true; paused = false;
    startOverlay.classList.add("hidden");
    overOverlay.classList.add("hidden");
    draw();
  }

  function gameOver(){
    alive = false; running = false;
    finalScoreEl.textContent = score;
    overOverlay.classList.remove("hidden");
  }

  function togglePause(){
    if(!running || !alive) return;
    paused = !paused;
    document.getElementById("pauseBtn").textContent = paused ? "继续" : "暂停";
  }

  // 键盘
  window.addEventListener("keydown", function(e){
    const k = e.key.toLowerCase();
    if(k === "arrowup" || k === "w"){ setDir(0,-1); e.preventDefault(); }
    else if(k === "arrowdown" || k === "s"){ setDir(0,1); e.preventDefault(); }
    else if(k === "arrowleft" || k === "a"){ setDir(-1,0); e.preventDefault(); }
    else if(k === "arrowright" || k === "d"){ setDir(1,0); e.preventDefault(); }
    else if(k === " "){ togglePause(); e.preventDefault(); }
  });

  // 方向按钮
  document.querySelectorAll(".pad button[data-dir]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const d = b.getAttribute("data-dir");
      if(d==="up") setDir(0,-1);
      else if(d==="down") setDir(0,1);
      else if(d==="left") setDir(-1,0);
      else if(d==="right") setDir(1,0);
    });
  });
  document.getElementById("pauseBtn").addEventListener("click", togglePause);

  // 滑动
  let tsx=0, tsy=0;
  canvas.addEventListener("touchstart", e=>{ const t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; }, {passive:true});
  canvas.addEventListener("touchend", e=>{
    const t=e.changedTouches[0];
    const dx=t.clientX-tsx, dy=t.clientY-tsy;
    if(Math.abs(dx)<16 && Math.abs(dy)<16) return;
    if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0);
    else setDir(0,dy>0?1:-1);
  }, {passive:true});

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("retryBtn").addEventListener("click", startGame);

  // 初始静态画面
  reset(); alive=false; running=false; draw();
  loop();
})();
</script>
</body>
</html>
